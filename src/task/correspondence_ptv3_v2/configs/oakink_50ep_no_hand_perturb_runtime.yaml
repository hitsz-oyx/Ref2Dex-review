_base_: src/task/correspondence_ptv3_v2/configs/hand_heatmap.yaml

name: correspondence_ptv3_v2_oakink_50ep_no_hand_perturb_runtime

data:
  train_path: /mnt/ugreen_nas/storage/Ref2Dex_storage/OakInk/processed/stage3_corr_oakink_mano_face_handroot_20260818
  val_split: 0.1
  batch_size: 16
  val_batch_size: 16
  num_workers: 4
  group_val_by_sequence: true
  sequence_locality_shuffle: true
  persistent_workers: true
  prefetch_factor: 4
  cache_index_path: output/cache/oakink_stage3_corr_index.json

meta:
  coordinate_frame: hand_root
  use_mano_reconstruction: false
  apply_hand_perturb: false
  runtime_resample_object: true
  stored_hand_proxy_indices_path: src/task/correspondence_ptv3_v2/calibration/oakink_stored_hand_fps256.json
  hand_proxy_face_count: 256
  runtime_near_pool_points: 1024
  runtime_near_obj_points: 384
  apply_obj_perturb: true
  obj_perturb_prob: 1.0
  val_obj_perturb_prob: 1.0

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.02
  warmup_steps: 0
  epochs: 50
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 100
  diagnostic_every_steps: 100
  eval_every_epochs: 1
  save_every_epochs: 5
  max_to_keep: 4
  metric_for_best: val_clean/cross_edge_random_qfl
  lower_is_better: true
  distributed:
    enable: false

wandb:
  enable: true
  project: ref2dex
  mode: online
  tags: [correspondence, ptv3, v2, oakink, no-hand-perturb, stored-hand-proxy, runtime-resample]
