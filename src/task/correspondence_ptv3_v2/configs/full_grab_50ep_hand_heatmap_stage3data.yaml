_base_: src/task/correspondence_ptv3_v2/configs/hand_heatmap.yaml

name: correspondence_ptv3_v2_full_grab_50ep_hand_heatmap_stage3data

# Training data path: this config requires the Stage 3 v2.1 schema with
# the new mano_* fields (see process/common/stage3_corr.py and
# tests/test_stage3_mano_reconstruction.py). Run stage 2 + stage 3
# with the current code first:
#   python -m process.GRAB.stage2_optimize \
#       --grab-root /path/to/GRAB_root \
#       --output-root /path/to/stage2/GRAB_initonly_4096_ds4_v21 \
#       --overwrite --obj-unit m
#   python -m process.common.stage3_corr \
#       --stage2-root /path/to/stage2/GRAB_initonly_4096_ds4_v21 \
#       --output-root /path/to/stage3/GRAB_initonly_4096_ds4_v21 \
#       --overwrite
# The legacy v2.0 path is also still supported (the runner falls back
# to the pre-stored hand_points when mano_* fields are absent).

data:
  train_path: data/processed_data/stage3/data/GRAB/initonly_4096_ds4_v21
  batch_size: 64
  val_batch_size: 32
  num_workers: 4
  group_val_by_sequence: true
  sequence_locality_shuffle: true
  persistent_workers: true
  prefetch_factor: 4

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.02
  warmup_steps: 0
  epochs: 50
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 100
  diagnostic_every_steps: 100
  eval_every_epochs: 1
  save_every_epochs: 5
  max_to_keep: 4
  metric_for_best: val_clean/cross_edge_random_qfl
  lower_is_better: true
  distributed:
    enable: true
    backend: auto
    timeout_minutes: 60
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: true
  project: ref2dex
  mode: online
  tags: [correspondence, ptv3, v2, full-grab, 50ep, hand-heatmap, lambda005, recovery-metrics, stage3-data]
