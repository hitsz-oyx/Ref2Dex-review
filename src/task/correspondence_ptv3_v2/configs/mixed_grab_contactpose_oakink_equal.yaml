_base_: src.task.correspondence_ptv3_v2.config:Config

name: correspondence_ptv3_v2_mixed_grab_contactpose_oakink_equal

# From-scratch three-domain baseline.  Each local batch has 1/3 samples from
# every domain; the loader does not weight domains by their frame counts.
data:
  # Kept non-empty for the generic train CLI validation; the task loader
  # ignores it whenever domain_paths is present.
  train_path: /mnt/ugreen_nas/storage/Ref2Dex_storage/GRAB/processed/stage3/grab_initonly_4096_v21
  domain_paths:
    - id: grab
      path: /mnt/ugreen_nas/storage/Ref2Dex_storage/GRAB/processed/stage3/grab_initonly_4096_v21
      cache_index_path: output/cache/grab_stage3_corr_index.json
    - id: contactpose
      path: /mnt/ugreen_nas/storage/Ref2Dex_storage/processed_data/stage3/data/ContactPose/use_stage3_v2
      cache_index_path: output/cache/contactpose_stage3_corr_index.json
    - id: oakink
      path: /mnt/ugreen_nas/storage/Ref2Dex_storage/OakInk/processed/stage3_corr_oakink_mano_face_handroot_20260818
      cache_index_path: output/cache/oakink_stage3_corr_index.json
  val_split: 0.1
  batch_size: 48
  val_batch_size: 48
  num_workers: 4
  group_val_by_sequence: true
  sequence_locality_shuffle: false
  persistent_workers: true
  prefetch_factor: 4

meta:
  coordinate_frame: hand_root
  use_mano_reconstruction: false
  apply_hand_perturb: false
  # Explicitly disabled for this first three-domain baseline.
  runtime_resample_object: false
  # Keep the existing object-pose corruption protocol; this is not scale augmentation.
  apply_obj_perturb: true
  obj_perturb_prob: 1.0
  val_obj_perturb_prob: 1.0

train:
  # No resume/checkpoint: BaseRunner starts from random initialization.
  resume: null
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  warmup_steps: 0
  epochs: 100
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 20
  diagnostic_every_steps: 100
  eval_every_epochs: 1
  save_every_epochs: 5
  max_to_keep: 4
  metric_for_best: val_clean/grab/cross_edge_random_qfl
  lower_is_better: true
  distributed:
    enable: true
    backend: auto
    timeout_minutes: 60

wandb:
  enable: true
  project: ref2dex
  mode: online
  tags: [correspondence, ptv3, v2, mixed, grab, contactpose, oakink, equal-domain, no-runtime-resample, no-scale-augmentation]
