_base_: src/task/correspondence_ptv3_v2/configs/hand_heatmap.yaml

name: smoke_test_v20_legacy

# WARNING: train_path and val_path are intentionally the SAME directory.
# This config verifies the legacy v2.0 smoke data flow end-to-end (no
# MANO forward, no runtime object resampling); it does NOT measure
# generalisation. Do NOT use the resulting val numbers for any
# performance comparison, model selection, or paper claim.
#
# Fix #1 (docs/指导.md): legacy v2.0 data has no ``mano_*`` fields, so
# the dataset MUST be loaded with ``use_mano_reconstruction=false``;
# otherwise the strict schema gate in CorrStaticDatasetV2 raises
# KeyError before training even starts.
#
# Fix #4 (docs/指导.md): ``use_mano_reconstruction=false`` is also
# incompatible with the default ``runtime_resample_object=true`` (the
# resampler still needs smplx + MANO .pkl for the hand proxy), so we
# pin ``runtime_resample_object=false`` here for a true zero-smplx
# legacy smoke. The runner's __init__ enforces this combination.

data:
  train_path: /mnt/ugreen_nas/storage/oyx_storage/ref2dex_stage3/GRAB/initonly_4096_ds4/s1
  val_path: /mnt/ugreen_nas/storage/oyx_storage/ref2dex_stage3/GRAB/initonly_4096_ds4/s1
  batch_size: 4
  val_batch_size: 4
  num_workers: 0
  group_val_by_sequence: true
  sequence_locality_shuffle: true
  persistent_workers: false
  prefetch_factor: 2
  blacklist_path: null

meta:
  use_mano_reconstruction: false
  apply_hand_perturb: false
  runtime_resample_object: false

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.0
  warmup_steps: 0
  epochs: 1
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 1
  diagnostic_every_steps: 1
  eval_every_epochs: 1
  save_every_epochs: 1
  max_to_keep: 1
  metric_for_best: val_clean/cross_edge_random_qfl
  lower_is_better: true
  distributed:
    enable: false
    backend: auto
    timeout_minutes: 60
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: false
  project: ref2dex
  mode: disabled
  tags: [correspondence, ptv3, v2, smoke-test, v20-legacy, samedata]
