_base_: src.task.correspondence_ptv3_v2.config:Config

name: correspondence_ptv3_v2_multigpu_gb256

meta:
  num_obj_points: 512
  num_hand_points: 1538
  num_supervision_edges: 128
  contact_supervision_quotas: [16, 16, 16, 16]
  contact_radius: 0.01
  quality_focal_beta: 2.0
  coordinate_frame: hand_root
  obj_rot_std_deg: 10.0
  obj_trans_std: 0.01
  obj_perturb_prob: 1.0
  loss_cross_edge_weight: 1.0
  loss_contact_aux_weight: 1.0
  loss_hand_contact_weight: 0.0
  val_obj_perturb_prob: 1.0

data:
  batch_size: 128
  val_batch_size: 64
  num_workers: 4
  group_val_by_sequence: true
  sequence_locality_shuffle: true
  persistent_workers: true
  prefetch_factor: 4

train:
  optimizer: adamw
  lr: 1.5e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  warmup_steps: 0
  epochs: 250
  amp: true
  grad_clip_norm: 1.0
  log_every_steps: 20
  save_every_epochs: 5
  eval_every_epochs: 1
  metric_for_best: val_clean/cross_edge_random_qfl
  lower_is_better: true
  distributed:
    enable: true
    backend: auto
    timeout_minutes: 60
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: true
  project: ref2dex
  mode: online
  tags: [correspondence, ptv3, v2, soft-contact, qfl, multigpu, gb256]
