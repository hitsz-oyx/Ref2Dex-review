_base_: src/task/correspondence_ptv3_v2/configs/hand_heatmap.yaml

name: smoke_test_v21_mano

meta:
  # Fix #9 (docs/指导.md): the smoke test must exercise the full
  # MANO-reconstruction + hand-PCA-perturbation pipeline.  Without these
  # flags the smoke run silently uses the legacy hand_points path and
  # ``has_mano`` stays False, so the MANO forward never executes and the
  # perturbation code is dead.  Setting them here is what makes this a
  # genuine integration test for Fix #1-#8.
  use_mano_reconstruction: true
  apply_hand_perturb: true
  # The full config uses hand_pca_std=0.5 in train; the smoke test
  # intentionally halves it so a single batch never produces a wild pose.
  hand_pca_std: 0.1
  hand_pca_noise_scale: 0.10
  hand_pca_noise_clip: 3.0
  hand_axis_angle_std_rad: 0.05
  hand_axis_angle_clip_rad: 0.15
  hand_perturb_prob: 0.8
  hand_proxy_face_count: 256
  runtime_cdist_chunk_size: 512
  # Exercise runtime resampling when the input is a current v2.1 export.
  # Legacy files carrying obj_candidate_mask_5cm intentionally stay on
  # their precomputed candidate-mask path.
  runtime_resample_object: true

data:
  # Tiny subset (one subject, one sequence) for a training smoke test.
  train_path: /tmp/stage3_test_grab
  val_path: /tmp/stage3_test_grab
  batch_size: 4
  val_batch_size: 4
  num_workers: 0
  group_val_by_sequence: true
  sequence_locality_shuffle: true
  persistent_workers: false
  prefetch_factor: 2
  blacklist_path: null

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.0
  warmup_steps: 0
  epochs: 1
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 1
  diagnostic_every_steps: 1
  eval_every_epochs: 1
  save_every_epochs: 1
  max_to_keep: 1
  metric_for_best: val_clean/cross_edge_random_qfl
  lower_is_better: true
  distributed:
    enable: false
    backend: auto
    timeout_minutes: 60
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: false
  project: ref2dex
  mode: disabled
  tags: [correspondence, ptv3, v2, smoke-test, mano-v21]
