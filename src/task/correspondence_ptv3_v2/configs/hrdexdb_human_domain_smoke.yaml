_base_: src.task.correspondence_ptv3_v2.config:Config

name: correspondence_ptv3_v2_hrdexdb_human_domain_smoke

data:
  train_path: /mnt/ugreen_nas/storage/Ref2Dex_storage/processed_data/stage3/hrdexdb_minimal_allhands_v1/human
  val_path: /mnt/ugreen_nas/storage/Ref2Dex_storage/processed_data/stage3/hrdexdb_minimal_allhands_v1/human
  domain_paths:
    - id: hrdexdb_human
      path: /mnt/ugreen_nas/storage/Ref2Dex_storage/processed_data/stage3/hrdexdb_minimal_allhands_v1/human
      val_path: /mnt/ugreen_nas/storage/Ref2Dex_storage/processed_data/stage3/hrdexdb_minimal_allhands_v1/human
  batch_size: 2
  val_batch_size: 2
  num_workers: 0
  shuffle: false
  group_val_by_sequence: true
  sequence_locality_shuffle: false
  persistent_workers: false
  prefetch_factor: 2

meta:
  coordinate_frame: hand_root
  use_mano_reconstruction: true
  apply_hand_perturb: true
  hand_perturb_prob: 1.0
  hand_axis_angle_std_rad: 0.02
  hand_axis_angle_clip_rad: 0.06
  runtime_resample_object: false
  apply_obj_perturb: true
  obj_perturb_prob: 1.0
  val_obj_perturb_prob: 1.0

train:
  device: cuda
  amp: false
  distributed:
    enable: false
  epochs: 1
  max_steps: 1

wandb:
  enable: false
  mode: disabled
