_base_: src/task/correspondence_ptv3_v2/configs/hand_heatmap.yaml

name: correspondence_ptv3_v2_mixed_stage3_geometry_9mm_sample

# Local compatibility fixture. Replace this manifest with full-dataset v2.1
# splits for training; the ARCTIC and ContactPose profiles below are preliminary
# sample statistics, while the GRAB profile was calibrated on 1024 frames.
data:
  root: .
  split_json_path: tmp/mano_geometry_calibration/mixed_stage3_v21/splits.json
  batch_size: 3
  val_batch_size: 3
  num_workers: 0
  sequence_locality_shuffle: false
  persistent_workers: false

meta:
  use_mano_reconstruction: true
  apply_hand_perturb: true
  hand_geometry_calibration_paths:
    grab: src/task/correspondence_ptv3_v2/calibration/grab_pca24_target_9mm.json
    arctic: src/task/correspondence_ptv3_v2/calibration/arctic_axis_angle45_target_9mm_sample.json
    contactpose: src/task/correspondence_ptv3_v2/calibration/contactpose_pca15_target_9mm_sample.json
  hand_geometry_noise_scale: 1.0
  hand_geometry_noise_required: true
  mano_model_dir: dataset/arctic/data/body_models/mano
  runtime_resample_object: true

train:
  distributed:
    enable: false

wandb:
  enable: false
