# Formal-training proposal only. Do not run before separate user approval.
schema_name: object_interaction_cmv2_grab_v1_2
source:
  name: grab
  hand_source: mano
  stride: 1
  index: ${REF2DEX_GRAB_MANO_CACHE}/index.json
  manifest: ${REF2DEX_GRAB_MANO_CACHE}/run_manifest.json
model:
  hidden_width: 128
  num_tokens: 16
  use_residual: true
  knn_k: 32
  interaction_radius_m: 0.02
  interaction_mode: swept
training:
  mode: formal
  max_sequences: null
  batch_size: 2
  max_steps: 10000
  checkpoint_interval: 1000
  learning_rate: 0.001
  seed: 42
  device: cuda:1
output_root: ${REF2DEX_CMV2_OUTPUT_ROOT}
