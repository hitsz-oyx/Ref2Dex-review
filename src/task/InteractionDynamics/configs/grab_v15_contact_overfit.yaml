_base_: src.task.InteractionDynamics.config:Config
model:
  class_path: src.task.InteractionDynamics.model.PretrainedTokenInteractionModel
meta:
  pose_encoder_checkpoint: null
  action_encoder_checkpoint: output/Actiontoken/research/action_encoder_v2_large100k.pt
  action_encoder_mode: flow_v2
  freeze_pose_encoder: true
  freeze_action_encoder: true
  action_world_layers: 2
  action_local_gain: 1.0
  contact_sigma_m: 0.01
data:
  root: data/processed_data/interaction_dynamics_v1/data/grab
  train_path: data/processed_data/interaction_dynamics_v1/data/grab
  dominant_hand_manifest: data/processed_data/interaction_dynamics_v1/dominant_hand.jsonl
  hand_side: right
  val_split: 0.0
  max_train_samples: 32
  min_object_effect_norm: 0.0001
  intervention_on_train: true
  batch_size: 4
  num_workers: 0
  shuffle: false
train:
  seed: 42
  epochs: 188
  overfit_mode: true
  lr: 0.0001
  uni3d_lr: 0.00001
  weight_decay: 0.0
  scheduler: null
  grad_clip_norm: 1.0
  se3_translation_loss_weight: 1.0
  se3_rotation_loss_weight: 10.0
  contact_loss_weight: 1.0
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 20
  save_every_epochs: 47
  metric_for_best: train/contact/mse
  lower_is_better: true
wandb:
  mode: offline
