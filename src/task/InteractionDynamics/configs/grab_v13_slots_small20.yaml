_base_: src.task.InteractionDynamics.config:Config

meta:
  use_v7_field: true
  field_dim: 128
  field_sigma_m: 0.05
  field_ablation: full
  pose_pair_action: true
  action_decomposition_reconstruction: true
  interaction_slots: 8
  interaction_slot_heads: 8

data:
  root: data/processed_data/interaction_dynamics_v1/data/grab
  train_path: data/processed_data/interaction_dynamics_v1/data/grab
  dominant_hand_manifest: data/processed_data/interaction_dynamics_v1/dominant_hand.jsonl
  split_json_path: data/processed_data/interaction_dynamics_v1/splits/small20/split.json
  max_samples_per_sequence: 128
  min_object_effect_norm: 0.0001
  batch_size: 4
  num_workers: 4
  shuffle: true
  pin_memory: true

train:
  seed: 42
  epochs: 5
  lr: 0.0001
  uni3d_lr: 0.00001
  weight_decay: 0.05
  scheduler: null
  grad_clip_norm: 1.0
  effect_loss_weight: 0.0
  se3_translation_loss_weight: 1.0
  se3_rotation_loss_weight: 10.0
  action_loss_weight: 0.0
  action_articulation_loss_weight: 100.0
  action_root_translation_loss_weight: 1.0
  action_root_rotation_loss_weight: 10.0
  static_pose_reconstruction_loss_weight: 0.01
  patch_effect_loss_weight: 0.0
  relative_loss_weight: 0.0
  interaction_reconstruction_loss_weight: 0.0
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 20
  save_every_epochs: 1
  metric_for_best: val/object/ade_mm
  lower_is_better: true

wandb:
  mode: offline
