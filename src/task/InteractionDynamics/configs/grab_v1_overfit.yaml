_base_: src.task.InteractionDynamics.config:Config

data:
  root: data/processed_data/interaction_dynamics_v1/data/grab
  train_path: data/processed_data/interaction_dynamics_v1/data/grab
  dominant_hand_manifest: data/processed_data/interaction_dynamics_v1/dominant_hand.jsonl
  val_split: 0.0
  max_train_samples: 64
  min_object_effect_norm: 0.0001
  batch_size: 4
  num_workers: 0
  shuffle: false
  pin_memory: true

train:
  seed: 42
  epochs: 100
  overfit_mode: true
  optimizer: adamw
  lr: 0.0001
  uni3d_lr: 0.00001
  weight_decay: 0.0
  scheduler: null
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 1
  save_every_epochs: 25

wandb:
  mode: offline
