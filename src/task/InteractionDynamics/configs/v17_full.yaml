data:
  root: data/processed_data/interaction_dynamics_v1/data/grab
  dominant_hand_manifest: data/processed_data/interaction_dynamics_v1/dominant_hand.jsonl
  split_seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  cache_root: output/research/InteractionDynamics/v17/cache
interaction: {horizon: 4, anchors: 128, object_knn: 32, tau_m: 0.015}
goal: {segment: 4, motion_window: 3, translation_threshold_cm: 0.2, rotation_threshold_deg: 1.0}
model: {dim: 256, heads: 8, layers: 6}
diffusion: {steps: 100, prediction_type: v, timestep_sampling: uniform, sampling_steps: 25}
training:
  epochs: 30
  per_gpu_batch: 64
  grad_accum_steps: 1
  lr: 0.0002
  weight_decay: 0.0001
  precision: bf16
  num_workers: 4
distributed: {backend: nccl, world_size: 4}
wandb: {mode: online, project: ref2dex, group: interaction-dynamics-v17, name: interaction-dynamics-v17-full-ddp}
seed: 42
