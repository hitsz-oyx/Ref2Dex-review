_base_: src.task.InteractionDynamics.config:Config

model:
  class_path: src.task.InteractionDynamics.model.DenseEdgeInteractionModel

meta:
  dense_edge_knn: 4
  dense_edge_dim: 64
  dense_edge_sigma_m: 0.02

data:
  root: data/processed_data/interaction_dynamics_v1/data/grab
  train_path: data/processed_data/interaction_dynamics_v1/data/grab
  dominant_hand_manifest: data/processed_data/interaction_dynamics_v1/dominant_hand.jsonl
  split_json_path: data/processed_data/interaction_dynamics_v1/splits/small20/split.json
  max_samples_per_sequence: 128
  min_object_effect_norm: 0.0001
  batch_size: 4
  num_workers: 4
  shuffle: true
  pin_memory: true

train:
  seed: 42
  epochs: 5
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.05
  scheduler: null
  grad_clip_norm: 1.0
  dense_relative_loss_weight: 1.0
  relative_edge_radius_cm: 5.0
  amp: true
  amp_dtype: bfloat16
  metric_for_best: val/dense_relative/rmse_cm
  lower_is_better: true
  log_every_steps: 20
  save_every_epochs: 1

wandb:
  mode: offline
