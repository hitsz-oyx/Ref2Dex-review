_base_: src.task.Posetoken.config:Config

data:
  train_samples: 1024
  val_samples: 256
  test_samples: 256
  batch_size: 64
  num_workers: 0
  shuffle: true

train:
  epochs: 100
  lr: 0.001
  weight_decay: 0.05
  dense_reconstruction_loss_weight: 1.0
  global_reconstruction_loss_weight: 1.0
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 20
  save_every_epochs: 5

wandb:
  mode: offline
