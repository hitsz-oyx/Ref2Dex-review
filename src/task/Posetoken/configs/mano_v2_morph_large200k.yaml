_base_: src.task.Posetoken.config:Config

model:
  pretrained_checkpoint: outputs/posetoken/pose_token_20260811_000540/checkpoints/best.pt

data:
  train_samples: 200000
  val_samples: 10000
  test_samples: 10000
  val_seed: 43
  test_seed: 44
  on_the_fly: true
  beta_std: 0.75
  train_pose_group_size: 2
  eval_pose_group_size: 2
  batch_size: 128
  val_batch_size: 256
  test_batch_size: 256
  num_workers: 4
  persistent_workers: true
  shuffle: true

train:
  epochs: 20
  lr: 0.0005
  weight_decay: 0.05
  scheduler: cosine
  warmup_ratio: 0.02
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 100
  eval_every_epochs: 1
  save_every_epochs: 2
  max_to_keep: 5

wandb:
  mode: online
  group: posetoken-v2-large
  name: posetoken-v2-morph-large200k-stage2
  tags: [pose-token, synthetic-mano, large, stage2, morphology]
