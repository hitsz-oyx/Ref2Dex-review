_base_: src.task.Posetoken.config:Config

data:
  train_samples: 32
  val_samples: 32
  test_samples: 128
  val_seed: 42
  test_seed: 44
  batch_size: 8
  num_workers: 0
  shuffle: false

train:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.0
  scheduler: null
  grad_clip_norm: null
  dense_reconstruction_loss_weight: 1.0
  global_reconstruction_loss_weight: 1.0
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 20
  save_every_epochs: 10

wandb:
  mode: offline
