_base_: src.task.Actiontoken.config:Config
runner_class: src.task.Actiontoken.runner.ActionTokenV2Runner
model:
  class_path: src.task.Actiontoken.model.ActionTokenV2Model
data:
  train_samples: 32
  val_samples: 32
  test_samples: 128
  val_seed: 42
  test_seed: 44
  generation_batch_size: 128
  motion_stds: [0.02, 0.06, 0.12]
  motion_probs: [0.4, 0.4, 0.2]
  sparse_probability: 0.5
  batch_size: 8
  num_workers: 0
  shuffle: false
train:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.0
  scheduler: null
  grad_clip_norm: null
  amp: true
  amp_dtype: bfloat16
  log_every_steps: 50
  save_every_epochs: 100
wandb:
  mode: offline
