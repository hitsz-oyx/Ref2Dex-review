_base_: src.task.Cp.config:Config

name: cp_human_closure
meta:
  stage: hand_decoder
  num_obj_points: 512
  num_hand_points: 1538
  dim: 256
  num_cp_tokens: 8
  num_cm_tokens: 16
data:
  train_path: processed_data/generated/stage5
  val_split: 0.1
  batch_size: 8
  val_batch_size: 8
