_base_: src.task.Cm.config:Config

# ``data.batch_size`` is per DDP process.  Launch with two GPUs to obtain the
# advertised global batch size of 256.
name: cm_action_slot16_subset100_hop4_multigpu_gb256

data:
  train_path: processed_data/generated/stage4/grab_subset100_cm_raw_stride3_hop4_4096_hand_root
  val_path: null
  val_split: 0.1
  batch_size: 128
  val_batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  shuffle: true
  group_val_by_sequence: true
  active_only: true
  min_object_flow_norm: 0.0
  max_train_samples: null
  max_val_samples: null

train:
  output_dir: outputs/train/cm_action_slot16_subset100_hop4_multigpu_gb256
  seed: 42
  overfit_mode: false
  optimizer: adamw
  lr: 1.5e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  warmup_steps: 0
  epochs: 20
  max_steps: null
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 20
  eval_every_epochs: 1
  save_every_epochs: 5
  metric_for_best: val/flow_mse
  lower_is_better: true
  distributed:
    enable: true
    backend: auto
    timeout_minutes: 60
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: true
  project: ref2dex
  mode: online
  tags: [cm, slot-attention, slot16, grab-subset100, hop4, multigpu, gb256, group-held-out]
