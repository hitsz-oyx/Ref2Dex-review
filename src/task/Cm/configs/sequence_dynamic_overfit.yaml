_base_: src.task.Cm.config:Config

name: cm_sequence_dynamic_overfit

data:
  train_path: processed_data/generated/cm_sequence_cache
  active_only: true
  min_stride: 1
  max_stride: 12
  batch_size: 2
  shuffle: false
  num_workers: 0
  max_train_samples: 2
  val_split: 0.0

train:
  output_dir: outputs/train/cm_sequence_dynamic_overfit
  overfit_mode: true
  lr: 0.001
  weight_decay: 0.0
  scheduler: null
  epochs: 500
  max_steps: 300
  log_every_steps: 25
  metric_for_best: train_epoch/flow_mse

wandb:
  enable: false
