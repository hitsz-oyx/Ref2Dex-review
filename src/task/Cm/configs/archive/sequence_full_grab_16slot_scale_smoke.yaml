_base_: sequence_full_grab_16slot.yaml

name: cm_full_grab_16slot_scale_smoke

meta:
  # full_grab_v1 train-only calibration (1068 sequences, strides 1..10).
  flow_target_rms_m: 0.09268507747442897
  hand_flow_input_scale: 17.71962521771656
  object_flow_target_scale: 10.78922332751884
  # The shared Stage 4 root has no metadata.json yet.  Keep this smoke
  # self-contained instead of mutating metadata used by existing runs.
  require_flow_calibration: false

data:
  # A compact validation panel is sufficient for the scale smoke test.
  val_strides: [1, 5, 10]
  max_val_samples: 512

train:
  epochs: 1
  max_steps: 2000
  # Keep LR effectively identical to the first 2k steps of the 20-epoch run;
  # a 2k-step cosine would otherwise decay to zero and confound the comparison.
  scheduler: null
  warmup_steps: 0
  grad_clip_norm: 1.0
  log_every_steps: 50
  eval_every_epochs: 1
  save_every_steps: 1000
  save_every_epochs: 1
  description: "Scale smoke on full_grab_v1: train-distribution hand/object flow normalization, no gate, 2000 fixed-LR steps, two-GPU DDP."

wandb:
  enable: false
  tags: [cm, full-grab, slot-16, no-gate, calibrated-scale, smoke, ddp-2]
