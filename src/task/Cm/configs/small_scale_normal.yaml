_base_: src.task.Cm.config:Config

name: cm_action_slot16_small_scale_normal

data:
  # The currently available smoke sets are the same GRAB sequence at two
  # temporal samplings.  This is an operational validation split only, not a
  # sequence-held-out generalization result.
  train_path: processed_data/generated/stage4/grab_cm_raw_stride3_smoke
  val_path: processed_data/generated/stage4/grab_cm_smoke
  val_split: 0.0
  batch_size: 2
  val_batch_size: 2
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  shuffle: true
  active_only: true
  min_object_flow_norm: 0.0
  max_train_samples: null
  max_val_samples: null

train:
  output_dir: outputs/train/cm_action_slot16_small_scale_normal_e20
  seed: 42
  overfit_mode: false
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  # Keep the full baseline schedule; only the dataset is small.
  epochs: 20
  max_steps: null
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 20
  eval_every_epochs: 1
  save_every_epochs: 1
  metric_for_best: val/flow_mse
  lower_is_better: true

wandb:
  enable: true
  project: ref2dex
  mode: offline
  tags: [cm, slot-attention, slot16, small-scale, normal-train]
