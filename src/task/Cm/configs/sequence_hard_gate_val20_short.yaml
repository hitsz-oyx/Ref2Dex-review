_base_: src.task.Cm.config:Config

name: cm_hard_gate_val20_short

meta:
  internal_point_flow_scale: 100.0
  loss_flow_weight: 1.0
  loss_slot_count_weight: 1.0e-3
  loss_slot_confidence_weight: 0.1
  loss_active_overlap_weight: 0.0
  slot_threshold: 0.85

data:
  train_path: processed_data/generated/cm_sequence_hard_gate_val20
  active_only: true
  min_stride: 1
  max_stride: 10
  # Sequence grouping holds out complete left/right sequence directories.
  val_split: 0.15
  group_val_by_sequence: true
  batch_size: 2
  val_batch_size: 2
  num_workers: 4
  persistent_workers: true

train:
  output_dir: outputs/train/cm_hard_gate_val20_short
  device: cuda:0
  lr: 1.5e-4
  amp: false
  epochs: 100
  max_steps: 8000
  log_every_steps: 100
  eval_every_epochs: 5
  save_every_steps: 1000
  save_every_epochs: 5
  metric_for_best: val/mean_stride_flow_mse
  lower_is_better: true

wandb:
  enable: false
  tags: [cm, hard-gate, weight-straight-through, fallback, val20, short-run]
