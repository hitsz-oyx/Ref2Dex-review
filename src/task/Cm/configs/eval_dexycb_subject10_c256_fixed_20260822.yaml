_base_: src.task.Cm.config:Config

name: cm_eval_dexycb_subject10_c256_fixed_20260822

meta:
  cm_dim: 256
  use_time_condition: true
  num_obj_pool: 4096
  num_obj_points: 512
  num_hand_points: 1538
  use_slot_gate: false
  # DexYCB is an external held-out cache, so it cannot carry the training
  # root's calibration metadata.  The checkpoint's fixed scale is retained.
  require_flow_calibration: false
  flow_target_rms_m: 0.07328625889337191
  object_flow_target_scale: 13.645122770626802

data:
  root: data/processed_data/stage4/data
  train_path: data/processed_data/stage4/data
  split_json_path: data/processed_data/stage4/splits/dexycb_subject10_fixed_v1/split.json
  val_path: null
  test_path: null
  val_split: 0.0
  active_only: true
  min_stride: 1
  max_stride: 10
  val_strides: [1, 5, 10]
  use_sampling_bank: false
  use_mmap: true
  shuffle: false
  batch_size: 32
  val_batch_size: 32
  test_batch_size: 32
  num_workers: 4
  persistent_workers: true

train:
  description: DexYCB subject-10 fixed-cache cross-dataset evaluation with converged C=256 checkpoint
  output_dir: outputs/cm/cm_eval_dexycb_subject10_c256_fixed_20260822
  device: cuda
  epochs: 1
  max_steps: 0
  amp: false
  distributed:
    enable: false

wandb:
  enable: false
  mode: disabled
  job_type: eval
  tags: [cm, eval, dexycb, subject-10, fixed-cache, c256]
