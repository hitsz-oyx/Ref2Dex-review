_base_: src.task.Cm.config:Config

name: cm_hand_decoder_warm_start

meta:
  # This old checkpoint contains the pretrained Cm encoder/object-flow path,
  # but does not contain the newly added Cm->Fm hand decoder tensors.
  warm_start_checkpoint: src/task/Cp/pretrained_ckpt/Cm_ckpt/best.pt
  dense_checkpoint: src/task/Cm/densetoken_ckpt/best.pt
  freeze_cm_encoder: true
  loss_object_weight: 0.0
  loss_hand_weight: 1.0

data:
  train_path: processed_data/generated/stage5
  val_split: 0.1
  batch_size: 8
  val_batch_size: 8
  active_only: true
  group_val_by_sequence: true

train:
  output_dir: outputs/train/cm_hand_decoder_warm_start
  lr: 1.0e-4
  epochs: 20
  metric_for_best: val/hand_epe_mm
  lower_is_better: true

wandb:
  enable: false
