_base_: src.task.Cm.config:Config

name: cm_hard_gate_train_val_test_short

meta:
  flow_smooth_l1_beta: 0.005
  flow_target_rms_m: 0.07591041486549019
  require_flow_calibration: true
  geometry_input_scale: 100.0
  hand_flow_input_scale: 20.0
  object_flow_target_scale: 13.17342293243891
  loss_flow_weight: 1.0
  loss_slot_count_weight: 1.0e-3
  loss_slot_confidence_weight: 0.1
  loss_active_overlap_weight: 0.0
  slot_threshold: 0.85

data:
  # These roots have disjoint complete sequences.  Do not use ``val_split``
  # when explicit held-out directories are supplied.
  root: data/processed_data/stage4/data
  train_split: data/processed_data/stage4/splits/sequence_split_v1/train.txt
  val_split_path: data/processed_data/stage4/splits/sequence_split_v1/val.txt
  test_split: data/processed_data/stage4/splits/sequence_split_v1/test.txt
  train_path: ""
  val_path: null
  test_path: null
  val_split: 0.0
  val_split: 0.0
  active_only: true
  min_stride: 1
  max_stride: 10
  group_val_by_sequence: true
  batch_size: 2
  val_batch_size: 2
  test_batch_size: 2
  num_workers: 4
  persistent_workers: true

train:
  output_dir: outputs/train/cm_hard_gate_train_val_test_vector_huber_10k
  device: cuda:3
  lr: 1.5e-4
  amp: false
  epochs: 100
  max_steps: 10000
  log_every_steps: 100
  eval_every_epochs: 5
  save_every_steps: 1000
  save_every_epochs: 5
  # The test set is deliberately excluded from checkpoint selection.
  metric_for_best: val/mean_stride_epe_mm
  lower_is_better: true

wandb:
  enable: false
  tags: [cm, hard-gate, train-val-test, vector-huber, epe, fallback]
