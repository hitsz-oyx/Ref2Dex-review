_base_: src.task.Cm.config:Config

name: cm_action

meta:
  coordinate_frame: hand_root_t
  num_obj_pool: 4096
  num_obj_points: 512
  num_hand_points: 1538
  cm_dim: 256
  num_cm_tokens: 16
  slot_iters: 3
  flow_smooth_l1_beta: 0.01
  # Object SmoothL1 was ~1.7e-4 on Cm_20260720_164133.  Its factor offsets
  # the larger wrist/articulation supervision introduced by the hand decoder.
  loss_object_weight: 5.0
  loss_hand_weight: 1.0
  loss_wrist_weight: 1.0
  loss_articulation_weight: 1.0
  loss_global_articulation_weight: 0.2
  wrist_rotation_weight_m_per_rad: 0.01
  hand_contact_sigma_m: 0.005
  hand_articulation_scale_m: 0.01
  hand_loss_base_weight: 0.2
  hand_loss_contact_weight: 1.5
  hand_loss_articulation_weight: 0.8
  hand_loss_max_weight: 3.0

data:
  batch_size: 2
  val_batch_size: 2
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  shuffle: true
  val_split: 0.1
  group_val_by_sequence: true
  active_only: true

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  epochs: 20
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 20
  eval_every_epochs: 1
  save_every_epochs: 5
  metric_for_best: val/flow_mse
  lower_is_better: true

wandb:
  enable: true
  project: ref2dex
  mode: offline
  tags: [cm, temporal, point-flow, frozen-dense-token]
