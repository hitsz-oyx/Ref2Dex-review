_base_: src.task.Cm.config:Config

name: cm_action

meta:
  coordinate_frame: hand_root_t
  num_obj_pool: 4096
  num_obj_points: 512
  num_hand_points: 1538
  cm_dim: 256
  num_cm_tokens: 16
  slot_iters: 3
  flow_smooth_l1_beta: 0.01
  loss_flow_weight: 1.0

data:
  batch_size: 2
  val_batch_size: 2
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  shuffle: true
  val_split: 0.1
  group_val_by_sequence: true
  active_only: true

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  epochs: 20
  amp: false
  grad_clip_norm: 1.0
  log_every_steps: 20
  eval_every_epochs: 1
  save_every_epochs: 5
  metric_for_best: val/flow_residual_norm_mean
  lower_is_better: true

wandb:
  enable: true
  project: ref2dex
  mode: offline
  tags: [cm, temporal, point-flow, frozen-dense-token]
