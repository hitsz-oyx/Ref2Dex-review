_base_: src.task.Cm.config:Config

name: cm_action_overfit_raw_stride3_smoke

data:
  train_path: processed_data/generated/stage4/grab_cm_raw_stride3_smoke
  val_path: null
  val_split: 0.0
  batch_size: 2
  num_workers: 0
  shuffle: false
  active_only: true
  # This smoke sequence has five 25ms pairs whose candidate-point mean flow is
  # at least 35mm.  Use the first two so the convergence check tests actual
  # point-flow prediction rather than near-static contact frames.
  min_object_flow_norm: 0.035
  max_train_samples: 2

train:
  output_dir: outputs/train/cm_action_overfit_raw_stride3
  seed: 42
  overfit_mode: true
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0
  scheduler: null
  epochs: 500
  max_steps: 300
  amp: false
  log_every_steps: 25
  save_every_steps: 100
  save_every_epochs: 500
  metric_for_best: train_epoch/flow_mse
  lower_is_better: true

wandb:
  enable: false
