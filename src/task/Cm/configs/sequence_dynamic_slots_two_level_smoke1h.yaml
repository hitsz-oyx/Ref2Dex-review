_base_: src.task.Cm.config:Config

name: cm_dynamic_slots_hard_gate_smoke12_1h

meta:
  internal_point_flow_scale: 100.0
  loss_flow_weight: 1.0
  # This is now a sum across 16 dynamic slots rather than a normalized mean.
  loss_slot_count_weight: 1.0e-3
  loss_slot_confidence_weight: 0.1
  slot_threshold: 0.85
  loss_active_overlap_weight: 0.0

data:
  train_path: processed_data/generated/cm_sequence_dynamic_slots_smoke12
  active_only: true
  min_stride: 1
  max_stride: 10
  val_split: 0.0
  batch_size: 2
  num_workers: 4
  persistent_workers: true

train:
  output_dir: outputs/train/cm_dynamic_slots_hard_gate_smoke12_1h
  device: cuda:0
  lr: 1.5e-4
  amp: false
  epochs: 1000
  max_steps: 40000
  log_every_steps: 100
  save_every_steps: 1000
  save_every_epochs: null

wandb:
  enable: false
  tags: [cm, dynamic-slots, hard-gate, straight-through, fallback-slot, smoke12]
