_base_: src.task.correspondence_ptv3.config:Config

name: correspondence_ptv3_bin_contact_multigpu_gb256

meta:
  use_cross_attn: false
  use_cano_head: false
  use_finger_region_head: false
  gamma: 1.0
  num_contact_bins: 10
  contact_bin_decode_mode: expectation
  contact_bin_weights:
    - 0.04906267471446666
    - 0.124615854284691
    - 0.5289112177088706
    - 1.0479041499564616
    - 1.4865461685891466
    - 1.6614463943665032
    - 1.722506187101053
    - 1.5057927629354453
    - 1.0416008624789648
    - 0.8316137278643991
  k_ctx: 32
  k_logit: 64
  ctx_radius: 0.04
  logit_near_radius: 0.025
  logit_far_min_radius: 0.025
  loss_obj_contact_weight: 0.0
  loss_cross_edge_weight: 1.0
  loss_cano_weight: 0.0
  loss_cross_edge_rankk_weight: 0.0
  loss_finger_weight: 0.0
  loss_region_weight: 0.0
  val_augment: true
  val_hand_perturb_prob: 1.0

data:
  batch_size: 64
  val_batch_size: 64
  num_workers: 4
  group_val_by_sequence: true
  sequence_locality_shuffle: true
  persistent_workers: true
  prefetch_factor: 4

train:
  optimizer: adamw
  lr: 1.5e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  warmup_steps: 0
  epochs: 250
  amp: true
  grad_clip_norm: 1.0
  log_every_steps: 20
  save_every_epochs: 5
  eval_every_epochs: 1
  metric_for_best: val_clean/loss
  lower_is_better: true
  distributed:
    enable: true
    backend: auto
    timeout_minutes: 60
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: true
  project: ref2dex
  mode: online
  tags: [correspondence, ptv3, static, bin-contact, multigpu, gb256]
