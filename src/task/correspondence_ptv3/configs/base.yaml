defaults:
  - edge_sampler: balanced
  - contact_supervision: bin
  - model: ptv3_concat
  - _self_

name: correspondence_ptv3
runner_class: src.task.correspondence_ptv3.runner.CorrespondencePTV3Runner

meta:
  num_obj_points: 512
  num_obj_pool: 4096
  num_hand_points: 1538
  k_cross: 32
  k_ctx: 32
  ctx_radius: 0.04
  fix_overfit_seed: false
  d_pos: 0.005
  d_neg: 0.03
  gamma: 1.0
  corr_contact_label_min: 0.1
  hand_rot_std_deg: 10.0
  hand_trans_std: 0.01
  hand_perturb_prob: 1.0
  augment: true
  apply_hand_perturb: true
  val_augment: true
  val_hand_perturb_prob: 1.0
  num_fingers: 6
  num_regions: 6
  loss_obj_contact_weight: 1.0
  loss_cross_edge_weight: 1.0
  loss_cano_weight: 0.0
  loss_cross_edge_rankk_weight: 0.0
  loss_finger_weight: 0.0
  loss_region_weight: 0.0
  rankk_loss_k: 4
  rankk_label_gap: 0.15
  rankk_margin: 0.2
  pr_label_threshold: 0.5
  rotation_range: 180.0
  translation_range: 0.1
  scale_range: [0.9, 1.1]
  augment_rotation: true
  augment_translation: false
  augment_scale: false

data:
  train_path: ""
  val_path: ""
  val_split: 0.1
  batch_size: 8
  val_batch_size: 16
  num_workers: 0
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  blacklist_path: null
  group_val_by_sequence: true
  sequence_locality_shuffle: true

train:
  output_dir: outputs/train/correspondence_ptv3
  seed: 42
  overfit_mode: false
  device: auto
  epochs: 100
  max_steps: null
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_ratio: null
  warmup_steps: 1000
  grad_clip_norm: 1.0
  amp: false
  compile: false
  log_every_steps: 50
  eval_every_steps: null
  eval_every_epochs: 1
  save_every_steps: null
  save_every_epochs: 10
  max_to_keep: 5
  resume: null
  early_stopping_patience: null
  early_stopping_threshold: 0.0
  metric_for_best: val_clean/loss
  lower_is_better: true
  distributed:
    enable: false
    backend: auto
    timeout_minutes: 30
    broadcast_buffers: false
    find_unused_parameters: false

wandb:
  enable: true
  project: ref2dex
  entity: null
  group: null
  name: correspondence_ptv3
  tags: [correspondence, ptv3, static]
  mode: offline
  job_type: train
  log_model: false
