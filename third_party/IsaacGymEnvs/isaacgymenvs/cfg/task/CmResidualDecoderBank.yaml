name: CmResidualDecoderBank

physics_engine: ${..physics_engine}

env:
  numEnvs: ${resolve_default:64,${...num_envs}}
  envSpacing: 1.0
  episodeLength: 432
  controlFrequencyInv: 2
  clipObservations: 10.0
  clipActions: 1.0
  handHeight: 0.25
  objectHeight: 0.10
  positionStiffness: 80.0
  positionDamping: 4.0
  residualQScale: 0.08
  residualRootTranslationScale: 0.015
  residualRootRotationScale: 0.20
  distanceRewardScale: 2.0
  liftRewardScale: 20.0
  actionPenaltyScale: 0.01
  successLift: 0.08
  tipLinks: [index_tip, middle_tip, pinky_tip, ring_tip, thumb_tip]
  asset:
    assetRoot: /home2/wyy/oyx_ws/Ref2Dex/src/task/CmDecoderv2/assets
    assetFileName: inspire_hand_new/inspire_hand_right.urdf
    objectAssetRoot: /home2/wyy/oyx_ws/Ref2Dex/third_party/IsaacGymEnvs/assets
    objectAssetFileName: urdf/objects/cube_multicolor.urdf

task:
  randomize: False
  randomization_params: {}

basePolicy:
  mode: decoder_bank
  decoderCheckpoint: /home2/wyy/oyx_ws/Ref2Dex/outputs/cmdecoderv2/cm_decoder_v2_mano_actual_finetune_v1_batch8_20260913_092251/checkpoints/best.pt
  decoderBankManifest: /home2/wyy/oyx_ws/Ref2Dex/outputs/cmdecoderv2/rl_decoder_bank_s1_airplane_best_20260913/manifest.json
  referenceQPath: /home2/wyy/oyx_ws/Ref2Dex/outputs/cmdecoderv2/rl_decoder_bank_s1_airplane_best_20260913/q_finger_decoder_bank.npy
  referenceWristPath: /home2/wyy/oyx_ws/Ref2Dex/outputs/cmdecoderv2/rl_decoder_bank_s1_airplane_best_20260913/wrist_pose_decoder_bank.npy

sim:
  dt: 0.01667
  substeps: 2
  up_axis: z
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}}
    num_position_iterations: 8
    num_velocity_iterations: 1
    num_subscenes: ${....num_subscenes}
    max_gpu_contact_pairs: 8388608
