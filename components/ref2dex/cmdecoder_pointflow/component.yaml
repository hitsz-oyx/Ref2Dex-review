api_version: component/v1
id: ref2dex.cmdecoder.pointflow.inspire_f1
version: 0.4.0
entrypoint: src.task.CmDecoder.point_model:CmPointFlowModel
capabilities:
  - fit
  - predict
  - evaluate
status: active
inputs:
  representation:
    type: latent
    shape: "[B,16,256]"
    dtype: float32
  target_hand_points:
    type: point_cloud
    shape: "[B,1538,3]"
    dtype: float32
    unit: meter
    constraints:
      coordinate_frame: current_wrist
  target_hand_normals:
    type: normal_field
    shape: "[B,1538,3]"
    dtype: float32
    constraints:
      coordinate_frame: current_wrist
outputs:
  hand_flow:
    type: point_flow
    shape: "[B,1538,3]"
    dtype: float32
    unit: meter
    constraints:
      coordinate_frame: current_wrist
      temporal_semantics: t_to_t_plus_stride
tags:
  - learner
  - point_flow
  - cross_embodiment
  - inspire_f1
  - ref2dex
